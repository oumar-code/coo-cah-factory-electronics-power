site_name: Coo-Cah Garage & Power Electronics Factory
site_description: >
  Tier 1 Critical Infrastructure — Blueprint, operational docs & AI-integration specs for the
  Coo-Cah Garage & Power Electronics Factory (Sagamu, Ogun State, Nigeria).
site_url: https://oumar-code.github.io/coo-cah-factory-electronics-power/
repo_url: https://github.com/oumar-code/coo-cah-factory-electronics-power
repo_name: oumar-code/coo-cah-factory-electronics-power
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - scheme: default
      primary: deep-orange
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: deep-orange
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.tabs.link
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - mermaid2:
      javascript: javascripts/mermaid-loader.mjs

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

nav:
  - Home: index.md
  - Master Repo Reference: master-repo-ref.md
  - Supplementary Docs:
    - Implementation Plan: implementation-plan.md
    - Full Readiness Register: readiness-register.md
    - DT Weekly Review Log: dt-weekly-review-log.md
    - DT Simulation Evidence Pack: dt-simulation-evidence-pack.md
    - DT Connectivity Proof: dt-connectivity-proof.md
    - AI Platform Status: ai-platform-status.md
    - Pentest Scoping: pentest-scoping.md
    - Gap Closure Report: gap-closure-report.md
    - Intra-Group Supply Coordination: intragroup-supply-coordination.md
  - Factory Docs:
    - Machinery & Equipment: machinery.md
    - Energy Profile: energy-profile.md
    - Floor Plan: floor-plan.md
    - Automation Roadmap: automation-roadmap.md
    - Supply Chain: supply-chain.md
    - Regulatory & Compliance: regulatory.md
    - CapEx / OpEx: capex-opex.md
    - Digital Twin: digital-twin.md
    - MES Integration: mes-integration.md
    - Sensor Registry: sensor-map.md
    - BIM:
      - BIM Evidence Pack Overview: bim/README.md
      - Zone Boundaries: bim/zone-boundaries.md
      - Asset Anchors: bim/asset-anchors.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/oumar-code/Coo-Kah-Doks
      name: Master Repository — Coo-Kah-Doks

extra_css:
  - stylesheets/extra.css

copyright: >
  © 2025 Coo-Cah Technologies Holdings. All rights reserved. |
  Part of the Coo-Cah Manufacturing Ecosystem.
